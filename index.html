<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Sarpras Al-Fatih</title>
    <style>
        :root { --primary: #0369a1; --bg: #f5f6f8; --card: #ffffff; }
        body { font-family: sans-serif; background: var(--bg); padding: 20px; }
        .grid-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card { background: var(--card); padding: 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card h3 { font-size: 0.8rem; color: #6b7280; }
        .card p { font-size: 1.2rem; font-weight: bold; margin-top: 5px; }
        .program-list { display: grid; gap: 15px; }
        .program-card { background: white; padding: 20px; border-radius: 12px; border-left: 5px solid var(--primary); display: flex; justify-content: space-between; align-items: center; }
        .btn-link { background: var(--primary); color: white; padding: 8px 12px; border-radius: 6px; text-decoration: none; font-size: 0.8rem; }
        @media (max-width: 600px) { .program-card { flex-direction: column; align-items: flex-start; gap: 10px; } }
    </style>
</head>
<body>

    <header style="margin-bottom: 20px;">
        <h1>Monitoring Maintenance Sarpras</h1>
    </header>

    <div class="grid-summary" id="summary">
        <div class="card"><h3>Total Anggaran</h3><p id="tot-anggaran">Rp 0</p></div>
        <div class="card"><h3>Realisasi</h3><p id="tot-realisasi">Rp 0</p></div>
    </div>

    <div class="program-list" id="program-container">
        <p>Memuat data...</p>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxdbl-HUmPa6M1OD5lOm23aw-fGkk59-M1HHZL4QDRphy48Yjt_h2a8EY6vJ7qn10W43w/exec';

        async function loadData() {
            try {
                const response = await fetch(WEB_APP_URL);
                const data = await response.json();
                renderDashboard(data.master);
            } catch (err) {
                document.getElementById('program-container').innerHTML = 'Gagal memuat data.';
            }
        }

        function renderDashboard(data) {
            const container = document.getElementById('program-container');
            container.innerHTML = '';
            
            let totalAnggaran = 0;
            let totalRealisasi = 0;

            data.forEach(item => {
                // Kalkulasi total
                totalAnggaran += parseFloat(item.total || 0);
                totalRealisasi += parseFloat(item.realisasi || 0);

                // Render Kartu (Bukan tabel)
                const div = document.createElement('div');
                div.className = 'program-card';
                div.innerHTML = `
                    <div>
                        <strong>${item.nama}</strong><br>
                        <small style="color:gray">${item.status}</small>
                    </div>
                    <a href="${item.rab}" target="_blank" class="btn-link">Lihat RAB</a>
                `;
                container.appendChild(div);
            });

            document.getElementById('tot-anggaran').textContent = 'Rp ' + totalAnggaran.toLocaleString('id-ID');
            document.getElementById('tot-realisasi').textContent = 'Rp ' + totalRealisasi.toLocaleString('id-ID');
        }

        window.onload = loadData;
    </script>
</body>
</html>
