<script>
    // URL Web App baru kamu sudah terpasang di sini
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyPSNYSt2g-c9k_uELNWuBXWHEGbQvNlnZqnA9Lh1VJDPf6l4QeD2r1Ppj7WRghDYcmRw/exec"; 

    let localData = [];

    function switchTab(tabId) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        if(event) event.currentTarget.classList.add('active');
    }

    function loadData() {
        fetch(SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
                localData = data;
                renderTable(data);
                calculateAnalysis(data);
            }).catch(err => {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="10" style="text-align:center; color:red;">Gagal memuat data: ${err}</td></tr>`;
            });
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";
        
        // Loop dimulai dari indeks 1 karena indeks 0 berisi judul header baris ke-4
        for(let i = 1; i < data.length; i++) {
            let row = data[i];
            if(!row.program && !row.nama) continue; 
            if(row.program.includes("TOTAL") || row.nama.includes("TOTAL")) continue; 

            let statusClass = "bg-perencanaan";
            if(row.status === "On Going") statusClass = "bg-ongoing";
            if(row.status === "Selesai") statusClass = "bg-selesai";
            if(row.status === "On Hold") statusClass = "bg-onhold";

            let btnRab = (row.rab && row.rab !== "#") ? `<a class="link-btn" href="${row.rab}" target="_blank">📂 RAB</a>` : `<span class="link-disabled">📂 RAB</span>`;
            let btnDok = (row.dokumentasi && row.dokumentasi !== "#") ? `<a class="link-btn" href="${row.dokumentasi}" target="_blank">📸 Dok</a>` : `<span class="link-disabled">📸 Dok</span>`;
            let btnBukti = (row.bukti && row.bukti !== "#") ? `<a class="link-btn" href="${row.bukti}" target="_blank">🧾 Bukti</a>` : `<span class="link-disabled">🧾 Bukti</span>`;

            tbody.innerHTML += `<tr>
                <td>${row.no || i}</td>
                <td><b>${row.program}</b></td>
                <td>${row.nama}</td>
                <td><span class="badge ${statusClass}">${row.status}</span></td>
                <td>${row.total}</td>
                <td>${row.realisasi || 'Rp0'}</td>
                <td>${row.sisa}</td>
                <td>
                    <div style="display:flex; flex-direction:column; gap:2px;">
                        ${btnRab} ${btnDok} ${btnBukti}
                    </div>
                </td>
                <td><small>${row.keterangan || '-'}</small></td>
                <td><button onclick="openEdit('${row.nama}', '${row.status}', '${row.realisasi}', '${row.keterangan}')" style="cursor:pointer; background:var(--dark); color:white; border:none; padding:5px 10px; border-radius:4px; font-weight:bold;">Edit</button></td>
            </tr>`;
        }
    }

    function calculateAnalysis(data) {
        let totalAnggaran = 0;
        let totalRealisasi = 0;
        let statusCount = { "Selesai": 0, "On Going": 0, "On Hold": 0, "Perencanaan": 0 };

        for(let i = 1; i < data.length; i++) {
            let row = data[i];
            if(!row.nama) continue;
            if(row.program.includes("TOTAL") || row.nama.includes("TOTAL")) continue;

            let numTotal = Number(row.total.replace(/[^0-9,-]+/g,"").replace(",", "."));
            let numRealisasi = Number(row.realisasi.replace(/[^0-9,-]+/g,"").replace(",", "."));

            totalAnggaran += numTotal || 0;
            totalRealisasi += numRealisasi || 0;
            
            if(statusCount[row.status] !== undefined) {
                statusCount[row.status]++;
            }
        }

        let sisaSemua = totalAnggaran - totalRealisasi;
        document.getElementById('totalBudgetInfo').innerHTML = `
            <b>Total Anggaran Terencana:</b> Rp ${totalAnggaran.toLocaleString('id-ID')}<br>
            <b>Total Realisasi Saat Ini:</b> Rp ${totalRealisasi.toLocaleString('id-ID')}<br>
            <b>Sisa Anggaran Efektif:</b> Rp ${sisaSemua.toLocaleString('id-ID')}
        `;

        let totalProject = statusCount["Selesai"] + statusCount["On Going"] + statusCount["On Hold"] + statusCount["Perencanaan"];
        let persenSelesai = totalProject > 0 ? ((statusCount["Selesai"] / totalProject) * 100).toFixed(1) : 0;

        document.getElementById('analisaList').innerHTML = `
            <li><b>Total Project Terdata:</b> ${totalProject} Kegiatan</li>
            <li><b>Selesai:</b> ${statusCount["Selesai"]} pekerjaan (${persenSelesai}% dari total program)</li>
            <li><b>Sedang Berjalan (On Going):</b> ${statusCount["On Going"]} pekerjaan</li>
            <li><b>Tertunda (On Hold):</b> ${statusCount["On Hold"]} pekerjaan</li>
            <li><b>Tahap Perencanaan:</b> ${statusCount["Perencanaan"]} pekerjaan</li>
        `;
    }

    function openEdit(nama, status, realisasi, keterangan) {
        document.getElementById('editModal').style.display = 'flex';
        document.getElementById('oldName').value = nama;
        document.getElementById('editNama').value = nama;
        document.getElementById('editStatus').value = status;
        
        let cleanRealisasi = Number(realisasi.replace(/[^0-9,-]+/g,"").replace(",", "."));
        document.getElementById('editRealisasi').value = cleanRealisasi || 0;
        document.getElementById('editKeterangan').value = (keterangan === "undefined" || keterangan === "-") ? "" : keterangan;
    }

    function closeModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    function submitEdit() {
        const btn = document.querySelector('.btn-submit');
        btn.innerHTML = "Menyimpan ke Sheets...";
        btn.disabled = true;

        const dataUpdate = {
            oldName: document.getElementById('oldName').value,
            status: document.getElementById('editStatus').value,
            realisasi: document.getElementById('editRealisasi').value,
            keterangan: document.getElementById('editKeterangan').value
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify(dataUpdate)
        }).then(() => {
            alert("Data berhasil diupdate di Google Sheets!");
            closeModal();
            location.reload();
        }).catch(err => {
            alert("Gagal menyimpan data.");
            btn.innerHTML = "Simpan ke Google Sheets";
            btn.disabled = false;
        });
    }

    window.onload = loadData;
</script>
