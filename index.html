<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Sarpras Al-Fatih</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Dashboard Maintenance Sarpras</h1>
        <p>Madrasah Al-Fatih</p>
    </header>
    
    <div class="container">
        <div id="summary" class="summary-cards"></div>
        <input type="text" id="searchInput" placeholder="Cari nama pekerjaan atau program...">
        <table id="dataTable">
            <thead>
                <tr><th>ID</th><th>Program</th><th>Nama Pekerjaan</th><th>Status</th><th>Anggaran</th><th>Realisasi</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div id="modal" class="modal"><div class="modal-content"><span class="close">&times;</span><div id="modalBody"></div></div></div>
    <script src="app.js"></script>
</body>
</html>
