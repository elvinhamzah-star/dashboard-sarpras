function enhanceHeader() {
    const header = document.querySelector('header');
    if (!header) return;

    const existingTitle = header.querySelector('h1');
    const tabs = header.querySelector('.tabs');
    if (!tabs) return;

    if (header.querySelector('.brand-shell')) return;

    const brandShell = document.createElement('div');
    brandShell.className = 'brand-shell';

    const titleText = existingTitle ? existingTitle.textContent.trim() : 'Dashboard Maintenance Sarpras Madrasah Al-Fatih';
    brandShell.innerHTML = `
        <img class="brand-logo" src="${LOGO_SRC}" alt="Logo Madrasah Al-Fatih" onerror="this.style.display='none'">
        <div class="brand-text">
            <h1>${escapeHtml(titleText)}</h1>
            <p>Sistem Pelaporan Otomatis Progress Kerja & Manajemen Realisasi Anggaran Lapangan</p>
        </div>
    `;

    header.insertBefore(brandShell, tabs);
    if (existingTitle) existingTitle.remove();
}

function bindTabs() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
        if (!btn.onclick) {
            btn.onclick = function () {
                const tabId = btn.dataset.tab || '';
                if (tabId) switchTab(tabId, btn);
            };
        }
    });
}

function switchTab(tabId, btn) {
    document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
    const target = document.getElementById(tabId);
    if (target) target.classList.add('active');

    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    if (btn) {
        btn.classList.add('active');
    } else {
        const autoBtn = document.querySelector(`.tab-btn[data-tab="${tabId}"]`);
        if (autoBtn) autoBtn.classList.add('active');
    }
}

function closeModal() {
    const modal = document.getElementById('detailModal');

}

function loadData() {
    const url = `${API_URL}?v=${Date.now()}`;
    fetch(url, { cache: 'no-store' })
        .then(res => res.json())
        .then(data => {
            state.master = Array.isArray(data.master) ? data.master : [];
            state.timeline = Array.isArray(data.timeline) ? data.timeline : [];
            state.realisasi = Array.isArray(data.realisasi) ? data.realisasi : [];
            state.pengajuan = Array.isArray(data.pengajuan) ? data.pengajuan : [];
            state.dokumentasi = Array.isArray(data.dokumentasi) ? data.dokumentasi : [];

            normalizedData = normalizeData();

            renderDashboard();
        })
        .catch(err => {
            console.error(err);
            const target = document.getElementById('kpi-anggaran');
            if (target) target.innerText = 'Gagal memuat data';
        });
}

function normalizeData() {
    const timelineMap = groupById(state.timeline);
    const realisasiMap = groupById(state.realisasi);
    const pengajuanMap = groupById(state.pengajuan);
    const fotoMap = groupById(state.dokumentasi);

    return (state.master || [])
        .filter(item => item && String(item.id || '').trim())
        .filter(item => String(item.program || '').trim().toUpperCase() !== 'TOTAL KESELURUHAN ANGGARAN')
        .filter(item => /^P-\d+/.test(String(item.id).trim()))
        .map(item => {
            const id = String(item.id).trim();
            const timelineRows = timelineMap[id] || [];
            const realisasiRows = realisasiMap[id] || [];
            const pengajuanRows = pengajuanMap[id] || [];
            const fotoRows = fotoMap[id] || [];

            const latestTimeline = timelineRows.length ? timelineRows[timelineRows.length - 1] : {};
            const totalAnggaran = cleanNum(item.total_anggaran);
            const realisasiFromMaster = cleanNum(item.realisasi_terkini);
            const realisasiFromRows = sumByField(realisasiRows, 'nominal_realisasi');
            const realisasiTerkini = realisasiFromMaster > 0 ? realisasiFromMaster : realisasiFromRows;
            const sisaAnggaran = cleanNum(item.sisa_anggaran) > 0 ? cleanNum(item.sisa_anggaran) : Math.max(totalAnggaran - realisasiTerkini, 0);

            const progress = clamp(
                cleanNum(item.progress_percent || latestTimeline.progress_percent || 0),
                0,
                100
            );

            const issue = firstNonEmpty([
                item.isu_utama,
                latestTimeline.isu_kendala,
                latestTimeline.isu_utama,
                summarizeIssues(timelineRows)
            ]);

            const target = firstNonEmpty([
                item.target_selesai,
                latestTimeline.end_date,
                latestTimeline.target_selesai
            ]);

            return {
                ...item,
                total_anggaran: totalAnggaran,
                realisasi_terkini: realisasiTerkini,
                sisa_anggaran: sisaAnggaran,
                progress_percent: progress,
                isu_utama: issue,
                target_selesai: target,
                _timeline: timelineRows,
                _realisasi: realisasiRows,
                _pengajuan: pengajuanRows,
                _foto: fotoRows
            };
        });
}

function renderDashboard() {
    renderKpis();
    renderAlerts();
    renderOperasional();
    renderFinance();
    renderDocs();
    renderGallery();
    renderCharts();
}

function renderKpis() {
    const page1 = document.getElementById('page1');
    const grid = page1 ? page1.querySelector('.grid-kpi') : null;
    if (!grid) return;

    const totalPekerjaan = normalizedData.length;
    const totalAnggaran = normalizedData.reduce((acc, item) => acc + cleanNum(item.total_anggaran), 0);
    const totalRealisasi = normalizedData.reduce((acc, item) => acc + cleanNum(item.realisasi_terkini), 0);
    const totalSisa = normalizedData.reduce((acc, item) => acc + cleanNum(item.sisa_anggaran), 0);
    const penyerapan = totalAnggaran > 0 ? (totalRealisasi / totalAnggaran) * 100 : 0;
    const pekerjaanAktif = normalizedData.filter(item => !['Selesai'].includes(normalizeStatus(item.status))).length;

    grid.innerHTML = `
        <div class="scorecard kpi-primary">
            <h3>Total Pekerjaan</h3>
            <p>${totalPekerjaan}</p>
            <div class="kpi-sub">Seluruh pekerjaan terdaftar</div>
        </div>
        <div class="scorecard kpi-primary">
            <h3>Total Anggaran</h3>
            <p>${formatRp(totalAnggaran)}</p>
            <div class="kpi-sub">Nilai RAB keseluruhan</div>
        </div>
        <div class="scorecard kpi-success">
            <h3>Realisasi Terkini</h3>
            <p>${formatRp(totalRealisasi)}</p>
            <div class="kpi-sub">Realisasi per pekerjaan</div>
        </div>
        <div class="scorecard kpi-warning">
            <h3>Sisa Anggaran</h3>
            <p>${formatRp(totalSisa)}</p>
            <div class="kpi-sub">Anggaran tersisa</div>
        </div>
        <div class="scorecard kpi-danger">
            <h3>Penyerapan</h3>
            <p>${penyerapan.toFixed(2)}%</p>
            <div class="kpi-sub">Realisasi / Anggaran</div>
        </div>
        <div class="scorecard kpi-dark">
            <h3>Pekerjaan Aktif</h3>
            <p>${pekerjaanAktif}</p>
            <div class="kpi-sub">Belum selesai</div>
        </div>
    `;
}

function renderAlerts() {
    const container = document.getElementById('alert-container');
    if (!container) return;

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const alerts = [];

    normalizedData.forEach(item => {
        const status = normalizeStatus(item.status);
        const anggaran = cleanNum(item.total_anggaran);
        const realisasi = cleanNum(item.realisasi_terkini);
        const target = parseFlexibleDate(item.target_selesai);

        if (status === 'On Hold') {
            alerts.push({
                type: 'On Hold',
                title: `[${item.id}] ${item.nama_pekerjaan}`,
                text: item.isu_utama || 'Pekerjaan tertahan.'
            });
        }

        if (anggaran > 0 && realisasi > anggaran) {
            alerts.push({
                type: 'Over Budget',
                title: `[${item.id}] ${item.nama_pekerjaan}`,
                text: `Realisasi ${formatRp(realisasi)} melebihi anggaran ${formatRp(anggaran)}.`
            });
        }

        if (target && status !== 'Selesai' && target < today) {
            alerts.push({
                type: 'Target Lewat',
                title: `[${item.id}] ${item.nama_pekerjaan}`,
                text: `Target selesai ${formatDateId(target)} sudah terlewati.`
            });
        }

        const issueText = String(item.isu_utama || '').toLowerCase();
        if (issueText && /kendala|masalah|menunggu|terhambat|garansi|approval/.test(issueText)) {
            alerts.push({
                type: 'Isu Utama',
                title: `[${item.id}] ${item.nama_pekerjaan}`,
                text: item.isu_utama
            });
        }
    });

    const unique = dedupeAlerts(alerts).slice(0, 8);

    if (!unique.length) {
        container.innerHTML = `<div class="empty-state">Tidak ada isu kritis saat ini.</div>`;
        return;
    }

    container.innerHTML = `<div class="alert-list">${unique.map(a => `
        <div class="alert-box">
            <div class="alert-head">
                <div class="alert-title">${escapeHtml(a.title)}</div>
                <div class="alert-type">${escapeHtml(a.type)}</div>
            </div>
            <div class="alert-text">${escapeHtml(a.text)}</div>
        </div>
    `).join('')}</div>`;
}

function renderOperasional() {
    const container = document.getElementById('operasional-container');
    const bar = document.getElementById('status-filter-bar');
    if (!container) return;

    if (bar) {
        bar.querySelectorAll('.filter-chip').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.filter === currentFilter);
            btn.onclick = function () {
                currentFilter = btn.dataset.filter;
                renderOperasional();
            };
        });
    }

    const filtered = normalizedData.filter(item => {
        const status = normalizeStatus(item.status);
        return currentFilter === 'Semua' ? true : status === currentFilter;
    });

    if (!filtered.length) {
        container.innerHTML = `<div class="empty-state">Tidak ada pekerjaan pada filter ini.</div>`;
        return;
    }

    container.innerHTML = filtered.map((item, index) => {
        const status = normalizeStatus(item.status);
        const kind = normalizeKind(item.jenis_pekerjaan);
        const progress = clamp(cleanNum(item.progress_percent), 0, 100);
        const vendor = item.vendor ? String(item.vendor).replace(/\n/g, ' • ') : 'Internal PBB';
        const target = item.target_selesai ? formatTarget(item.target_selesai) : 'Belum Ditentukan';
        const photoCount = Array.isArray(item._foto) ? item._foto.length : 0;
        const issue = item.isu_utama || 'Tidak ada catatan khusus.';

        return `
            <div class="job-card" onclick="openModal(${normalizedData.indexOf(item)})">
                <div class="job-top">
                    <span class="badge status-${statusClass(status)}">${escapeHtml(status)}</span>
                    <span class="badge kind-${kindClass(kind)}">${escapeHtml(kind)}</span>
                </div>
                <h4>${escapeHtml(item.nama_pekerjaan || '-')}</h4>
                <div class="job-meta">${escapeHtml(item.program || '')}</div>
                <div class="progress-wrap">
                    <progress value="${progress}" max="100"></progress>
                    <div class="progress-label">${progress.toFixed(1)}%</div>
                </div>
                <div class="job-meta">
                    <strong>Vendor:</strong> ${escapeHtml(vendor)}<br>
                    <strong>Target:</strong> ${escapeHtml(target)}<br>
                    <strong>Foto:</strong> ${photoCount} item
                </div>
                <div class="job-meta" style="color:#0f172a;">
                    ${escapeHtml(shorten(issue, 110))}
                </div>
            </div>
        `;
    }).join('');
}

function renderFinance() {
    const summary = document.getElementById('finance-summary');
    const tableWrap = document.getElementById('finance-table-wrap');

    const items = [...normalizedData].sort((a, b) => cleanNum(b.total_anggaran) - cleanNum(a.total_anggaran));
    const overBudget = items.filter(i => cleanNum(i.total_anggaran) > 0 && cleanNum(i.realisasi_terkini) > cleanNum(i.total_anggaran)).length;
    const selesai = items.filter(i => normalizeStatus(i.status) === 'Selesai').length;
    const onGoing = items.filter(i => normalizeStatus(i.status) === 'On Going').length;
    const pengadaan = items.filter(i => normalizeKind(i.jenis_pekerjaan) === 'Pengadaan').length;

    if (summary) {
        summary.innerHTML = `
            <div class="mini-grid">
                <div class="mini-card">
                    <h4>Over Budget</h4>
                    <div class="value">${overBudget}</div>
                </div>
                <div class="mini-card">
                    <h4>Selesai</h4>
                    <div class="value">${selesai}</div>
                </div>
                <div class="mini-card">
                    <h4>On Going</h4>
                    <div class="value">${onGoing}</div>
                </div>
                <div class="mini-card">
                    <h4>Pengadaan</h4>
                    <div class="value">${pengadaan}</div>
                </div>
            </div>
        `;
    }

    if (tableWrap) {
        const rows = items.map(item => {
            const anggaran = cleanNum(item.total_anggaran);
            const realisasi = cleanNum(item.realisasi_terkini);
            const sisa = cleanNum(item.sisa_anggaran);
            let keuangan = 'Normal';
            let cls = 'status-normal';
            if (anggaran <= 0) {
                keuangan = 'Belum Ada RAB';
                cls = 'status-warning';
            } else if (realisasi > anggaran) {
                keuangan = 'Overbudget';
                cls = 'status-danger';
            } else if (anggaran > 0 && realisasi / anggaran >= 0.9) {
                keuangan = 'Mendekati Batas';
                cls = 'status-warning';
            }

            return `
                <tr>
                    <td>${escapeHtml(item.id || '')}</td>
                    <td>${escapeHtml(item.nama_pekerjaan || '')}</td>
                    <td>${formatRp(anggaran)}</td>
                    <td>${formatRp(realisasi)}</td>
                    <td>${formatRp(sisa)}</td>
                    <td><span class="status-pill ${cls}">${escapeHtml(keuangan)}</span></td>
                </tr>
            `;
        }).join('');

        tableWrap.innerHTML = `
            <h3 class="section-title">Tabel Finansial Per Pekerjaan</h3>
            <div class="chart-wrap">
                <table class="finance-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Pekerjaan</th>
                            <th>Anggaran</th>
                            <th>Realisasi</th>
                            <th>Sisa</th>
                            <th>Status Keuangan</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>
        `;
    }
}

function renderDocs() {

    const items = normalizedData.filter(item => item.link_rab_detail || item.link_dokumentasi || item.link_bukti_transaksi);

        const docs = [

            item.link_dokumentasi ? { href: item.link_dokumentasi, text: '📷 Dokumentasi', cls: 'bg-green' } : null,
            item.link_bukti_transaksi ? { href: item.link_bukti_transaksi, text: '🧾 Bukti Transaksi', cls: 'bg-yellow' } : null

            <div class="doc-card">

                    `).join('')}
                </div>
            </div>
        `;

}

function renderGallery() {
    const container = document.getElementById('gallery-container');
    if (!container) return;

    const rows = Array.isArray(state.dokumentasi) ? state.dokumentasi.filter(r => String(r.id || '').trim()) : [];
    if (!rows.length) {
        container.innerHTML = `<div class="gallery-empty">Belum ada dokumentasi foto. Tambahkan link foto di Sheet 5.</div>`;
        return;
    }

    const grouped = groupById(rows);
    const items = Object.keys(grouped).sort().map(id => {
        const photos = grouped[id];
        const meta = normalizedData.find(x => String(x.id).trim() === id) || {};
        const projectName = firstNonEmpty([meta.nama_pekerjaan, photos[0].nama_pekerjaan, id]);
        const program = firstNonEmpty([meta.program, photos[0].program, '']);
        const categories = groupByCategory(photos);

        const blocks = Object.keys(categories).map(cat => {
            const list = categories[cat];
            const thumbs = list.map(photo => {
                const imageUrl = toDriveImageUrl(photo.link_foto || photo.link || '');
                const caption = firstNonEmpty([photo.caption, '']);
                const date = photo.tanggal_upload ? formatDateAny(photo.tanggal_upload) : '';
                const label = [caption, date].filter(Boolean).join(' • ');

                return `
                    <a href="${escapeAttr(photo.link_foto || photo.link || '#')}" target="_blank" rel="noopener" title="${escapeAttr(caption)}">
                        <img src="${escapeAttr(imageUrl)}" alt="${escapeAttr(caption || projectName)}" onerror="this.style.display='none'">
                        ${label ? `<div class="cap">${escapeHtml(label)}</div>` : ''}
                    </a>
                `;
            }).join('');

            return `
                <div class="gallery-block">
                    <h5>${escapeHtml(cat)}</h5>
                    <div class="gallery-images">${thumbs}</div>
                </div>
            `;
        }).join('');

        return `
            <div class="gallery-card">
                <h4>${escapeHtml(projectName)}</h4>
                <div class="sub">${escapeHtml(program)} • ${escapeHtml(id)}</div>
                ${blocks}
            </div>
        `;
    }).join('');

    container.innerHTML = items;
}

function renderCharts() {
    if (statusChartInstance) statusChartInstance.destroy();
    if (financeChartInstance) financeChartInstance.destroy();

    const statusCounts = {
        'Selesai': 0,
        'On Going': 0,
        'On Hold': 0,
        'Perencanaan': 0
    };

    normalizedData.forEach(item => {
        const s = normalizeStatus(item.status);
        if (statusCounts[s] !== undefined) statusCounts[s] += 1;
        else statusCounts['Perencanaan'] += 1;
    });

    const ctxStatus = document.getElementById('statusChart');
    if (ctxStatus) {
        statusChartInstance = new Chart(ctxStatus, {
            type: 'doughnut',
            data: {
                labels: ['Selesai', 'On Going', 'On Hold', 'Perencanaan'],
                datasets: [{
                    data: [statusCounts['Selesai'], statusCounts['On Going'], statusCounts['On Hold'], statusCounts['Perencanaan']],
                    backgroundColor: ['#15803d', '#0369a1', '#b91c1c', '#6b7280'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom' }
                }
            }
        });
    }

    const ctxFinance = document.getElementById('financeChart');
    if (ctxFinance) {
        const labels = normalizedData.map(item => truncateLabel(item.nama_pekerjaan || '', 26));
        const anggaran = normalizedData.map(item => cleanNum(item.total_anggaran));
        const realisasi = normalizedData.map(item => cleanNum(item.realisasi_terkini));

        financeChartInstance = new Chart(ctxFinance, {
            type: 'bar',
            data: {
                labels,
                datasets: [
                    {
                        label: 'Anggaran',
                        data: anggaran,
                        backgroundColor: '#cbd5e1'
                    },
                    {
                        label: 'Realisasi',
                        data: realisasi,
                        backgroundColor: '#D4AF37'
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                indexAxis: 'y',
                plugins: {
                    legend: { position: 'bottom' }
                },
                scales: {
                    x: {
                        beginAtZero: true,
                        ticks: {
                            callback: value => formatRp(Number(value))
                        }
                    },
                    y: {
                        ticks: {
                            autoSkip: false
                        }
                    }
                }
            }
        });
    }
}

function openModal(index) {
    const item = normalizedData[index];
    if (!item) return;

    const modal = document.getElementById('detailModal');
    const modalExtra = document.getElementById('modal-extra');

    document.getElementById('m-nama').innerText = item.nama_pekerjaan || '-';

    const badge = document.getElementById('m-status');
    const status = normalizeStatus(item.status);
    badge.innerText = status;
    badge.className = `badge status-${statusClass(status)}`;

    document.getElementById('m-kategori').innerText = `${item.jenis_pekerjaan || '-'} • ${item.program || '-'}`;
    document.getElementById('m-anggaran').innerText = formatRp(cleanNum(item.total_anggaran));
    document.getElementById('m-realisasi').innerText = formatRp(cleanNum(item.realisasi_terkini));

    const sisa = cleanNum(item.sisa_anggaran);
    document.getElementById('m-sisa').innerText = formatRp(sisa);
    document.getElementById('m-sisa').style.color = sisa < 0 ? 'var(--danger)' : 'var(--dark)';

    document.getElementById('m-keterangan').innerText = item.isu_utama || 'Tidak ada catatan khusus.';

    if (modalExtra) {
        modalExtra.innerHTML = buildModalExtra(item);
    }

    modal.style.display = 'flex';
}

function buildModalExtra(item) {
    const docs = [
        item.link_rab_detail ? { href: item.link_rab_detail, text: '📄 Lihat RAB', cls: 'bg-blue' } : null,
        item.link_dokumentasi ? { href: item.link_dokumentasi, text: '📷 Dokumentasi', cls: 'bg-green' } : null,
        item.link_bukti_transaksi ? { href: item.link_bukti_transaksi, text: '🧾 Bukti Transaksi', cls: 'bg-yellow' } : null
    ].filter(Boolean);

    const timelineRows = Array.isArray(item._timeline) ? [...item._timeline].slice(-5).reverse() : [];
    const pengajuanRows = Array.isArray(item._pengajuan) ? [...item._pengajuan].slice(-5).reverse() : [];
    const realisasiRows = Array.isArray(item._realisasi) ? [...item._realisasi].slice(-5).reverse() : [];
    const fotoRows = Array.isArray(item._foto) ? item._foto : [];

    const timelineHtml = timelineRows.length ? timelineRows.map(row => `
        <div class="extra-item">
            <strong>${escapeHtml(firstNonEmpty([row.status_lapangan, row.status, row.progress_percent ? `${row.progress_percent}%` : 'Timeline']))}</strong>
            <div class="subtle">${escapeHtml(firstNonEmpty([row.tanggal, row.start_date, row.end_date, '']))}</div>
            <div>${escapeHtml(firstNonEmpty([row.isu_kendala, row.isu_utama, '']))}</div>
        </div>
    `).join('') : `<div class="subtle">Belum ada histori timeline.</div>`;

    const pengajuanHtml = pengajuanRows.length ? pengajuanRows.map(row => `
        <div class="extra-item">
            <strong>${formatRp(cleanNum(row.nilai_pengajuan))}</strong>
            <div class="subtle">${escapeHtml(firstNonEmpty([row.tanggal_pengajuan, '']))}</div>
            <div>${escapeHtml(firstNonEmpty([row.status_pencairan, '']))}</div>
            <div>${escapeHtml(firstNonEmpty([row.keterangan, '']))}</div>
        </div>
    `).join('') : `<div class="subtle">Belum ada histori pengajuan.</div>`;

    const realisasiHtml = realisasiRows.length ? realisasiRows.map(row => `
        <div class="extra-item">
            <strong>${formatRp(cleanNum(row.nominal_realisasi))}</strong>
            <div class="subtle">${escapeHtml(firstNonEmpty([row.tanggal_realisasi, '']))}</div>
            <div>${escapeHtml(firstNonEmpty([row.deskripsi_biaya, row.status_dana, '']))}</div>
        </div>
    `).join('') : `<div class="subtle">Belum ada histori realisasi.</div>`;

    const photoGroups = groupByCategory(fotoRows);
    const photoHtml = Object.keys(photoGroups).length ? Object.keys(photoGroups).map(cat => {
        const list = photoGroups[cat].slice(0, 6);
        const thumbs = list.map(photo => {
            const img = toDriveImageUrl(photo.link_foto || photo.link || '');
            return `
                <a class="thumb" href="${escapeAttr(photo.link_foto || photo.link || '#')}" target="_blank" rel="noopener">
                    <img src="${escapeAttr(img)}" alt="${escapeAttr(photo.caption || cat)}" onerror="this.style.display='none'">
                    <div class="cap">${escapeHtml(firstNonEmpty([photo.caption, photo.tanggal_upload, '']))}</div>
                </a>
            `;
        }).join('');

        return `
            <div class="extra-item">
                <strong>${escapeHtml(cat)}</strong>
                <div class="thumb-grid">${thumbs}</div>
            </div>
        `;
    }).join('') : `<div class="subtle">Belum ada foto.</div>`;

    return `
        <div class="modal-extra-grid">
            <div class="extra-card">
                <h4>Dokumen Cepat</h4>
                <div class="doc-actions" style="grid-template-columns:1fr; margin-top:8px;">
                    ${docs.map(d => `<a class="btn-doc ${d.cls}" href="${escapeAttr(d.href)}" target="_blank" rel="noopener">${d.text}</a>`).join('')}
                    ${!docs.length ? `<div class="subtle">Belum ada dokumen.</div>` : ''}
                </div>
            </div>

            <div class="extra-card">
                <h4>Histori Lapangan</h4>
                <div class="extra-list">${timelineHtml}</div>
            </div>

            <div class="extra-card">
                <h4>Pengajuan Dana</h4>
                <div class="extra-list">${pengajuanHtml}</div>
            </div>

            <div class="extra-card">
                <h4>Realisasi Dana</h4>
                <div class="extra-list">${realisasiHtml}</div>
            </div>

            <div class="extra-card" style="grid-column:1 / -1;">
                <h4>Galeri Foto</h4>
                <div class="extra-list">${photoHtml}</div>
            </div>
        </div>
    `;
}

function groupById(rows) {
    const out = {};
    (rows || []).forEach(row => {
        const id = String(row.id || '').trim();
        if (!id) return;
        if (!out[id]) out[id] = [];
        out[id].push(row);
    });
    return out;
}

function groupByCategory(rows) {
    const out = {};
    (rows || []).forEach(row => {
        const cat = firstNonEmpty([row.kategori_foto, row.kategori, 'Dokumentasi']);
        if (!out[cat]) out[cat] = [];
        out[cat].push(row);
    });
    return out;
}

function sumByField(rows, field) {
    return (rows || []).reduce((acc, row) => acc + cleanNum(row[field]), 0);
}

function normalizeStatus(status) {
    const s = String(status || 'Perencanaan').trim();
    if (/on\s*going/i.test(s)) return 'On Going';
    if (/on\s*hold/i.test(s)) return 'On Hold';
    if (/selesai/i.test(s)) return 'Selesai';
    if (/perencanaan/i.test(s)) return 'Perencanaan';
    if (/aktif/i.test(s)) return 'On Going';
    return s || 'Perencanaan';
}

function normalizeKind(kind) {
    const k = String(kind || '').trim();
    if (/proyek/i.test(k)) return 'Proyek';
    if (/pengadaan/i.test(k)) return 'Pengadaan';
    if (/program/i.test(k)) return 'Program';
    if (/operasional/i.test(k)) return 'Operasional';
    return k || 'Proyek';
}

function statusClass(status) {
    const s = normalizeStatus(status);
    if (s === 'On Going') return 'on-going';
    if (s === 'On Hold') return 'on-hold';
    if (s === 'Selesai') return 'selesai';
    if (s === 'Perencanaan') return 'perencanaan';
    return 'aktif';
}

function kindClass(kind) {
    const k = normalizeKind(kind);
    if (k === 'Proyek') return 'proyek';
    if (k === 'Pengadaan') return 'pengadaan';
    if (k === 'Program') return 'program';
    if (k === 'Operasional') return 'operasional';
    return 'proyek';
}

function firstNonEmpty(list) {
    for (const v of list || []) {
        if (v !== undefined && v !== null && String(v).trim() !== '') return v;
    }
    return '';
}

function summarizeIssues(rows) {
    const texts = [];
    (rows || []).forEach(r => {
        const txt = firstNonEmpty([r.isu_kendala, r.isu_utama, r.keterangan]);
        if (txt) texts.push(String(txt).trim());
    });
    return [...new Set(texts)].join(' | ');
}

function dedupeAlerts(alerts) {
    const seen = new Set();
    const out = [];
    alerts.forEach(a => {
        const key = `${a.type}|${a.title}|${a.text}`;
        if (seen.has(key)) return;
        seen.add(key);
        out.push(a);
    });
    return out;
}

function truncateLabel(text, len) {
    const s = String(text || '');
    if (s.length <= len) return s;
    return s.slice(0, len - 1) + '…';
}

function shorten(text, maxLen) {
    const s = String(text || '');
    if (s.length <= maxLen) return s;
    return s.slice(0, maxLen - 1) + '…';
}

function formatRp(angka) {
    const n = Number(angka || 0);
    return 'Rp ' + n.toLocaleString('id-ID');
}

function cleanNum(val) {
    if (val === null || val === undefined || val === '') return 0;
    const str = String(val).replace(/\s+/g, '').replace(/,/g, '.').replace(/[^0-9.-]/g, '');
    const parsed = parseFloat(str);
    return Number.isFinite(parsed) ? parsed : 0;
}

function clamp(value, min, max) {
    return Math.min(Math.max(Number(value || 0), min), max);
}

function formatTarget(value) {
    if (!value) return 'Belum Ditentukan';
    const d = parseFlexibleDate(value);
    if (d) return formatDateId(d);
    return String(value);
}

function formatDateAny(value) {
    const d = parseFlexibleDate(value);
    if (!d) return String(value || '');
    return formatDateId(d);
}

function parseFlexibleDate(value) {
    if (!value) return null;
    if (value instanceof Date && !isNaN(value)) return value;

    const s = String(value).trim();
    if (!s) return null;

    const iso = new Date(s);
    if (!isNaN(iso)) return iso;

    const m1 = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
    if (m1) {
        const d = parseInt(m1[1], 10);
        const m = parseInt(m1[2], 10) - 1;
        let y = parseInt(m1[3], 10);
        if (y < 100) y += 2000;
        const dt = new Date(y, m, d);
        if (!isNaN(dt)) return dt;
    }

    return null;
}

function formatDateId(date) {
    if (!(date instanceof Date) || isNaN(date)) return '';
    return new Intl.DateTimeFormat('id-ID', {
        day: '2-digit',
        month: 'short',
        year: 'numeric'
    }).format(date);
}

function escapeHtml(value) {
    return String(value === undefined || value === null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function escapeAttr(value) {
    return escapeHtml(value).replace(/`/g, '&#96;');
}

function toDriveImageUrl(url) {
    const safe = String(url || '').trim();
    if (!safe) return '';
    if (safe.includes('drive.google.com')) {
        const idMatch =
            safe.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) ||
            safe.match(/[?&]id=([a-zA-Z0-9_-]+)/) ||
            safe.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (idMatch && idMatch[1]) {
            return `https://drive.google.com/uc?export=view&id=${idMatch[1]}`;
        }
    }
    return safe;
}
