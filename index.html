<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Monitoring Sarpras Madrasah Al-Fatih</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
    --primary:#0F4C81;
    --secondary:#2C7A7B;
    --accent:#F4B942;

    --bg:#F5F7FA;
    --card:#FFFFFF;

    --success:#16A34A;
    --warning:#EA580C;
    --danger:#DC2626;

    --text:#1E293B;
    --muted:#64748B;
    --border:#E2E8F0;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:var(--bg);
    color:var(--text);
}

/* ======================
HEADER
====================== */

header{
    background:white;
    border-bottom:1px solid var(--border);
    padding:15px 20px;
    position:sticky;
    top:0;
    z-index:999;
}

.header-wrap{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo{
    width:60px;
    height:60px;
    object-fit:contain;
}

.title-group{
    display:flex;
    flex-direction:column;
}

.title-group h1{
    font-size:24px;
    color:var(--primary);
}

.title-group p{
    font-size:13px;
    color:var(--muted);
}

/* ======================
TAB
====================== */

.tabs{
    margin-top:15px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.tab-btn{
    border:none;
    cursor:pointer;
    padding:10px 16px;
    border-radius:10px;
    background:#E2E8F0;
    font-weight:600;
}

.tab-btn.active{
    background:var(--primary);
    color:white;
}

/* ======================
LAYOUT
====================== */

.container{
    max-width:1400px;
    margin:auto;
    padding:20px;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

/* ======================
KPI
====================== */

.kpi-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:16px;
    margin-bottom:20px;
}

.kpi-card{
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.kpi-title{
    color:var(--muted);
    font-size:13px;
}

.kpi-value{
    margin-top:8px;
    font-size:28px;
    font-weight:700;
    color:var(--primary);
}

/* ======================
CARD
====================== */

.card{
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.grid-2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.grid-3{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

/* ======================
OPERASIONAL CARD
====================== */

.job-card{
    background:white;
    border-radius:16px;
    padding:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
    border-left:6px solid var(--primary);
    cursor:pointer;
}

.job-title{
    font-weight:700;
    margin-bottom:10px;
}

.job-meta{
    font-size:13px;
    color:var(--muted);
    margin-bottom:4px;
}

.progress-wrap{
    margin-top:12px;
}

.progress-bar{
    width:100%;
    height:10px;
    border-radius:999px;
    background:#E2E8F0;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    background:var(--primary);
}

/* ======================
STATUS
====================== */

.badge{
    display:inline-block;
    padding:6px 12px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
    color:white;
}

.badge.selesai{
    background:var(--success);
}

.badge.ongoing{
    background:var(--primary);
}

.badge.hold{
    background:var(--danger);
}

.badge.plan{
    background:var(--warning);
}

/* ======================
DOKUMENTASI
====================== */

.gallery-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:20px;
}

.gallery-item{
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.gallery-item img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.gallery-caption{
    padding:12px;
}

/* ======================
MOBILE
====================== */

@media(max-width:768px){

.header-wrap{
    flex-direction:column;
    text-align:center;
}

.logo{
    width:80px;
    height:80px;
}

.title-group h1{
    font-size:20px;
}

.grid-2,
.grid-3{
    grid-template-columns:1fr;
}

.tabs{
    justify-content:center;
}

}

</style>
</head>

<body>

<header>

<div class="header-wrap">

<img src="logo.png" class="logo">

<div class="title-group">
<h1>Dashboard Monitoring Sarpras Madrasah Al-Fatih</h1>
<p id="lastUpdate">Memuat data...</p>
</div>

</div>

<div class="tabs">

<button class="tab-btn active" onclick="switchTab('ringkasan',this)">
Ringkasan
</button>

<button class="tab-btn" onclick="switchTab('operasional',this)">
Operasional
</button>

<button class="tab-btn" onclick="switchTab('finansial',this)">
Finansial
</button>

<button class="tab-btn" onclick="switchTab('dokumen',this)">
Dokumen
</button>

<button class="tab-btn" onclick="switchTab('galeri',this)">
Galeri
</button>

</div>

</header>

<div class="container">

<!-- RINGKASAN -->

<section id="ringkasan" class="page active">

<div class="kpi-grid">

<div class="kpi-card">
<div class="kpi-title">Total Anggaran</div>
<div class="kpi-value" id="kpiAnggaran">Rp0</div>
</div>

<div class="kpi-card">
<div class="kpi-title">Total Realisasi</div>
<div class="kpi-value" id="kpiRealisasi">Rp0</div>
</div>

<div class="kpi-card">
<div class="kpi-title">Sisa Anggaran</div>
<div class="kpi-value" id="kpiSisa">Rp0</div>
</div>

<div class="kpi-card">
<div class="kpi-title">Penyerapan</div>
<div class="kpi-value" id="kpiPersen">0%</div>
</div>

</div>

<div class="grid-2">

<div class="card">
<h3>Status Pekerjaan</h3>
<br>
<canvas id="statusChart"></canvas>
</div>

<div class="card">
<h3>Perhatian Khusus</h3>
<br>
<div id="isuContainer"></div>
</div>

</div>

</section>
<!-- OPERASIONAL -->

<section id="operasional" class="page">

<div style="margin-bottom:20px;">

<input
id="searchPekerjaan"
type="text"
placeholder="Cari pekerjaan..."
style="
width:100%;
padding:12px;
border-radius:12px;
border:1px solid #ddd;
font-size:14px;
">

</div>

<div
id="operasionalContainer"
style="
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:20px;
">
</div>

</section>

<!-- FINANSIAL -->

<section id="finansial" class="page">

<div class="grid-2">

<div class="card">

<h3>Anggaran vs Realisasi</h3>

<br>

<canvas id="financeChart"></canvas>

</div>

<div class="card">

<h3>Ringkasan Finansial</h3>

<br>

<div id="financeSummary">

Memuat...

</div>

</div>

</div>

<br>

<div class="card">

<h3>Detail Finansial</h3>

<br>

<div style="overflow:auto;">

<table
style="
width:100%;
border-collapse:collapse;
"
id="financeTable">

<thead>

<tr>

<th style="padding:10px;text-align:left;">
ID
</th>

<th style="padding:10px;text-align:left;">
Pekerjaan
</th>

<th style="padding:10px;text-align:right;">
Anggaran
</th>

<th style="padding:10px;text-align:right;">
Realisasi
</th>

<th style="padding:10px;text-align:right;">
Sisa
</th>

</tr>

</thead>

<tbody id="financeTableBody">

</tbody>

</table>

</div>

</div>

</section>

<!-- DOKUMEN -->

<section id="dokumen" class="page">

<div
id="dokumenContainer"
style="
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
">
</div>

</section>

<!-- GALERI -->

<section id="galeri" class="page">

<div
id="galeriContainer"
class="gallery-grid">

</div>

</section>

</div>

<!-- MODAL -->

<div
id="detailModal"
style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
justify-content:center;
align-items:center;
z-index:9999;
">

<div
style="
background:white;
width:90%;
max-width:700px;
max-height:90vh;
overflow:auto;
padding:25px;
border-radius:20px;
">

<div
style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
">

<h2 id="modalNama"></h2>

<button
onclick="closeModal()"
style="
border:none;
background:none;
font-size:28px;
cursor:pointer;
">
×
</button>

</div>

<div id="modalContent">

</div>

</div>

</div>

<script>

const API_URL =
'https://script.google.com/macros/s/AKfycbxdbl-HUmPa6M1OD5lOm23aw-fGkk59-M1HHZL4QDRphy48Yjt_h2a8EY6vJ7qn10W43w/exec';

let DATA = [];
let RAW = {};

let statusChart = null;
let financeChart = null;

/* ====================
TAB
==================== */

function switchTab(id,btn){

document
.querySelectorAll('.page')
.forEach(p=>p.classList.remove('active'));

document
.getElementById(id)
.classList.add('active');

document
.querySelectorAll('.tab-btn')
.forEach(b=>b.classList.remove('active'));

btn.classList.add('active');

}

/* ====================
MODAL
==================== */

function closeModal(){

document
.getElementById('detailModal')
.style.display='none';

}

/* ====================
HELPER
==================== */

function rupiah(n){

n=Number(n)||0;

return 'Rp '+
n.toLocaleString('id-ID');

}

function angka(v){

if(!v) return 0;

return parseFloat(
String(v)
.replace(/[^0-9.-]/g,'')
)||0;

}

function statusClass(status){

if(status==='Selesai')
return 'selesai';

if(status==='On Going')
return 'ongoing';

if(status==='On Hold')
return 'hold';

return 'plan';

}
    
/* ====================
LOAD DATA
==================== */

async function loadData(){

try{

const res = await fetch(API_URL);

RAW = await res.json();

const master = RAW.master || [];

DATA = master.map(item=>{

return{
id:item.id || '',
program:item.program || '',
nama:item.nama_pekerjaan || '',
jenis:item.jenis_pekerjaan || '',
status:item.status || 'Perencanaan',
progress:angka(item.progress_percent),
target:item.target_selesai || '',
vendor:item.vendor || '',
anggaran:angka(item.total_anggaran),
realisasi:angka(item.realisasi_terkini),
sisa:angka(item.sisa_anggaran),
isu:item.isu_utama || '',
rab:item.link_rab_detail || '',
dokumentasi:item.link_dokumentasi || '',
bukti:item.link_bukti_transaksi || ''
};

});

renderDashboard();

document.getElementById(
'lastUpdate'
).innerText =
'Update terakhir : '+
new Date().toLocaleString('id-ID');

}catch(err){

console.error(err);

alert(
'Gagal mengambil data dari Apps Script'
);

}

}

/* ====================
DASHBOARD
==================== */

function renderDashboard(){

renderKPI();

renderOperasional();

renderFinance();

renderDokumen();

renderAlerts();

renderCharts();

}

/* ====================
KPI
==================== */

function renderKPI(){

let totalAnggaran=0;
let totalRealisasi=0;

DATA.forEach(d=>{

totalAnggaran += d.anggaran;
totalRealisasi += d.realisasi;

});

let totalSisa =
totalAnggaran-totalRealisasi;

let persen =
totalAnggaran>0
?
(totalRealisasi/totalAnggaran)*100
:
0;

document.getElementById(
'kpiAnggaran'
).innerText =
rupiah(totalAnggaran);

document.getElementById(
'kpiRealisasi'
).innerText =
rupiah(totalRealisasi);

document.getElementById(
'kpiSisa'
).innerText =
rupiah(totalSisa);

document.getElementById(
'kpiPersen'
).innerText =
persen.toFixed(1)+'%';

}

/* ====================
ALERT
==================== */

function renderAlerts(){

const box =
document.getElementById(
'isuContainer'
);

let html='';

DATA.forEach(d=>{

if(
d.status==='On Hold'
||
d.isu
){

html += `
<div
style="
padding:12px;
border-left:4px solid #DC2626;
background:#FEF2F2;
margin-bottom:10px;
border-radius:8px;
">

<strong>
${d.id}
</strong>

<br>

${d.nama}

<br><br>

${d.isu || 'Perlu perhatian'}

</div>
`;

}

});

if(html===''){

html=
`
Tidak ada isu kritis
`;

}

box.innerHTML=html;

}

/* ====================
OPERASIONAL
==================== */

function renderOperasional(){

const box =
document.getElementById(
'operasionalContainer'
);

let html='';

DATA.forEach((d,index)=>{

html+=`

<div
class="job-card"
onclick="openModal(${index})"
>

<div
class="badge ${statusClass(d.status)}"
>

${d.status}

</div>

<br><br>

<div class="job-title">

${d.nama}

</div>

<div class="job-meta">

${d.id}

</div>

<div class="job-meta">

${d.vendor}

</div>

<div class="job-meta">

Target :
${d.target}

</div>

<div class="progress-wrap">

<div class="progress-bar">

<div
class="progress-fill"
style="
width:${d.progress}%;
">
</div>

</div>

</div>

<div
style="
margin-top:8px;
font-size:12px;
">

${d.progress}%

</div>

</div>

`;

});

box.innerHTML=html;

}

/* ====================
MODAL
==================== */

function openModal(index){

const d=DATA[index];

document.getElementById(
'modalNama'
).innerText =
d.nama;

document.getElementById(
'modalContent'
).innerHTML =

`

<p>
<b>ID</b><br>
${d.id}
</p>

<br>

<p>
<b>Program</b><br>
${d.program}
</p>

<br>

<p>
<b>Jenis</b><br>
${d.jenis}
</p>

<br>

<p>
<b>Status</b><br>
${d.status}
</p>

<br>

<p>
<b>Vendor</b><br>
${d.vendor}
</p>

<br>

<p>
<b>Target</b><br>
${d.target}
</p>

<br>

<p>
<b>Anggaran</b><br>
${rupiah(d.anggaran)}
</p>

<br>

<p>
<b>Realisasi</b><br>
${rupiah(d.realisasi)}
</p>

<br>

<p>
<b>Sisa</b><br>
${rupiah(d.sisa)}
</p>

<br>

<p>
<b>Isu Utama</b><br>
${d.isu || '-'}
</p>

<br>

<a
href="${d.rab}"
target="_blank"
>
📄 RAB
</a>

<br><br>

<a
href="${d.dokumentasi}"
target="_blank"
>
📷 Dokumentasi
</a>

<br><br>

<a
href="${d.bukti}"
target="_blank"
>
🧾 Bukti
</a>

`;

document.getElementById(
'detailModal'
).style.display='flex';

}
